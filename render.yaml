services:
  - type: web
    name: juju-api
    env: node
    region: oregon
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && node server.js
    healthCheckPath: /api/courses
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: juju-secret-key-2026
      - key: PORT
        value: 5001
